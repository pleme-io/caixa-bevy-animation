"[package]\nname = \"bevy_animation\"\nversion = \"0.19.0-dev\"\npublish = false\nedition = \"2024\"\ndescription = \"Provides animation functionality for Bevy Engine\"\nhomepage = \"https://bevy.org\"\nrepository = \"https://github.com/bevyengine/bevy\"\nlicense = \"MIT OR Apache-2.0\"\nkeywords = [\"bevy\"]\n\n[dependencies]\n# bevy\nbevy_animation_macros = { path = \"macros\", version = \"0.19.0-dev\" }\nbevy_app = { path = \"../bevy_app\", version = \"0.19.0-dev\" }\nbevy_asset = { path = \"../bevy_asset\", version = \"0.19.0-dev\" }\nbevy_color = { path = \"../bevy_color\", version = \"0.19.0-dev\" }\nbevy_derive = { path = \"../bevy_derive\", version = \"0.19.0-dev\" }\nbevy_math = { path = \"../bevy_math\", version = \"0.19.0-dev\" }\nbevy_mesh = { path = \"../bevy_mesh\", version = \"0.19.0-dev\", optional = true, features = [\n  \"morph\",\n] }\nbevy_reflect = { path = \"../bevy_reflect\", version = \"0.19.0-dev\", features = [\n  \"petgraph\",\n] }\nbevy_time = { path = \"../bevy_time\", version = \"0.19.0-dev\" }\nbevy_utils = { path = \"../bevy_utils\", version = \"0.19.0-dev\" }\nbevy_ecs = { path = \"../bevy_ecs\", version = \"0.19.0-dev\" }\nbevy_transform = { path = \"../bevy_transform\", version = \"0.19.0-dev\" }\nbevy_platform = { path = \"../bevy_platform\", version = \"0.19.0-dev\", default-features = false, features = [\n  \"std\",\n  \"serialize\",\n] }\n\n# other\npetgraph = { version = \"0.8\", features = [\"serde-1\"] }\nron = \"0.12\"\nserde = \"1\"\nblake3 = { version = \"1.0\" }\ndowncast-rs = { version = \"2\", default-features = false, features = [\"std\"] }\nthiserror = { version = \"2\", default-features = false }\nderive_more = { version = \"2\", default-features = false, features = [\"from\"] }\neither = \"1.13\"\nthread_local = \"1\"\nuuid = { version = \"1.21.0\", features = [\"v4\"] }\nsmallvec = { version = \"1\", default-features = false }\ntracing = { version = \"0.1\", default-features = false, features = [\"std\"] }\n\n[target.'cfg(target_arch = \"wasm32\")'.dependencies]\n# TODO: Assuming all wasm builds are for the browser. Require `no_std` support to break assumption.\nuuid = { version = \"1.21.0\", default-features = false, features = [\"js\"] }\n\n[lints.clippy]\ndoc_markdown = \"warn\"\nmanual_let_else = \"warn\"\nmatch_same_arms = \"warn\"\nredundant_closure_for_method_calls = \"warn\"\nredundant_else = \"warn\"\nsemicolon_if_nothing_returned = \"warn\"\ntype_complexity = \"allow\"\nundocumented_unsafe_blocks = \"warn\"\nunwrap_or_default = \"warn\"\nneedless_lifetimes = \"allow\"\ntoo_many_arguments = \"allow\"\nnonstandard_macro_braces = \"warn\"\nprint_stdout = \"warn\"\nprint_stderr = \"warn\"\nptr_as_ptr = \"warn\"\nptr_cast_constness = \"warn\"\nref_as_ptr = \"warn\"\ntoo_long_first_doc_paragraph = \"allow\"\nstd_instead_of_core = \"allow\"\nstd_instead_of_alloc = \"warn\"\nalloc_instead_of_core = \"warn\"\nallow_attributes = \"warn\"\nallow_attributes_without_reason = \"warn\"\n\n[lints.rust]\nmissing_docs = \"warn\"\nunexpected_cfgs = { level = \"warn\", check-cfg = ['cfg(docsrs_dep)'] }\nunsafe_code = \"deny\"\nunsafe_op_in_unsafe_fn = \"warn\"\nunused_qualifications = \"warn\"\n\n\n[package.metadata.docs.rs]\nrustdoc-args = [\n  \"-Zunstable-options\",\n  \"--generate-link-to-definition\",\n  \"--generate-macro-expansion\",\n]\nall-features = true\n"
